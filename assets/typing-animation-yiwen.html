<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Animation Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            text-align: left;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .typed-text {
            color: #2563eb;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #333;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="typed-text" id="typed"></span><span class="cursor">&nbsp;</span> Researcher
        </h1>
    </div>

    <script>
        // Words to cycle through
        const words = ['Mobile Systems', 'V2X Communications', '5G/6G Networks', 'Network Security', 'Mobile Health'];

        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typedElement = document.getElementById('typed');

        function type() {
            const currentWord = words[wordIndex];

            if (isDeleting) {
                // Remove character
                typedElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;

                // If word is fully deleted
                if (charIndex === 0) {
                    isDeleting = false;
                    wordIndex = (wordIndex + 1) % words.length; // Move to next word
                    setTimeout(type, 500); // Pause before typing next word
                    return;
                }
            } else {
                // Add character
                typedElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;

                // If word is fully typed
                if (charIndex === currentWord.length) {
                    isDeleting = true;
                    setTimeout(type, 2000); // Pause at full word (2 seconds)
                    return;
                }
            }

            // Typing speed
            const typingSpeed = isDeleting ? 25 : 50;
            setTimeout(type, typingSpeed);
        }

        // Start the typing effect
        type();
    </script>
</body>
</html>
