<style>
@keyframes shake {
  0%, 100% { transform: rotate(0deg); }
  10%, 30%, 50%, 70%, 90% { transform: rotate(-5deg); }
  20%, 40%, 60%, 80% { transform: rotate(5deg); }
}

.shake-animation {
  animation: shake 0.6s ease-in-out;
}

#xiaohua-image {
  transition: transform 0.1s ease;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="fwtitle">
</div>
<table summary="Table for page layout." id="tlayout">
<tr valign="top">
<td id="layout-menu">
<div id="sidebar-placeholder"></div>
<script>
fetch('sidebar.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('sidebar-placeholder').innerHTML = data;
    // Set current page
    var links = document.querySelectorAll('#layout-menu a[href="page_under_working.html"]');
    if (links.length > 0) links[0].classList.add('current');
  });
</script>
</td>
<td id="layout-content">
<div id="toptitle">
<h1>Page Under Construction</h1>
</div>

<div style="text-align: center; margin-top: 50px;">
<img id="xiaohua-image" src="photos/xiaohua/xiaohua1.png" alt="Xiaohua sleeping" style="max-width: 500px; width: 100%;" />
<p style="font-size: 20px; margin-top: 20px;">Xiaohua will finish this page when she wakes up.💤</p>
<audio id="snore-audio" src="photos/xiaohua/snore-sfx.mp3" preload="auto"></audio>
<audio id="yawn-audio" src="photos/xiaohua/yawn.mp3" preload="auto"></audio>
</div>

<script type="text/javascript">
(function() {
  var image = document.getElementById('xiaohua-image');
  var snoreAudio = document.getElementById('snore-audio');
  var yawnAudio = document.getElementById('yawn-audio');
  var hasPlayed = false;
  var shakeCount = 0;
  var isYawning = false;

  function triggerShake() {
    if (!hasPlayed && !isYawning) {
      image.classList.add('shake-animation');

      // Play snore audio with error handling
      var snorePromise = snoreAudio.play();
      if (snorePromise !== undefined) {
        snorePromise.catch(function(error) {
          console.log('Audio autoplay prevented:', error);
        });
      }

      hasPlayed = true;
      shakeCount++;

      // After 5 shakes, trigger yawn
      if (shakeCount >= 5) {
        isYawning = true;
        setTimeout(function() {
          image.src = 'photos/xiaohua/xiaohua_yawn.jpg';

          // Play yawn audio with error handling
          var yawnPromise = yawnAudio.play();
          if (yawnPromise !== undefined) {
            yawnPromise.catch(function(error) {
              console.log('Audio autoplay prevented:', error);
            });
          }
        }, 600); // Wait for shake animation to finish
      }
    }
  }

  // Mouse hover support (desktop)
  image.addEventListener('mouseenter', triggerShake);

  image.addEventListener('mouseleave', function() {
    hasPlayed = false;
  });

  // Click/tap support (mobile)
  image.addEventListener('click', function() {
    triggerShake();
    // Reset hasPlayed after a short delay for mobile
    setTimeout(function() {
      hasPlayed = false;
    }, 100);
  });

  image.addEventListener('animationend', function() {
    image.classList.remove('shake-animation');
  });

  // When yawn audio finishes, go back to sleeping image and reset
  yawnAudio.addEventListener('ended', function() {
    image.src = 'photos/xiaohua/xiaohua1.png';
    shakeCount = 0;
    isYawning = false;
  });
})();
</script>

</div>
</div>
