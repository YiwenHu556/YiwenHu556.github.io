<style>
    /* Subway-style scrolling ticker */
    .research-ticker {
        width: 100%;
        background: white;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        display: flex;
        align-items: center;
    }
    .ticker-label {
        background: none;
        color: #333;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: bold;
        font-size: 16px;
        padding: 10px 16px;
        white-space: nowrap;
        flex-shrink: 0;
        z-index: 1;
    }
    .ticker-track {
        overflow: hidden;
        flex: 1;
        min-width: 0;
    }
    .ticker-content {
        display: inline-block;
        white-space: nowrap;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        color: #2563eb;
        padding: 10px 0;
        will-change: transform;
    }
    .ticker-content span {
        padding: 0 12px;
    }
    .ticker-separator {
        color: rgba(37, 99, 235, 0.3);
        position: relative;
        top: 1px;
        display: inline-block;
        text-align: center;
        overflow: hidden;
    }
    .ticker-item {
        padding: 0;
        display: inline-block;
        text-align: center;
        overflow: hidden;
        position: relative;
        top: 2.5px;
    }
    .ticker-item.glitching {
    }

    /* Original typing animation styles (kept as backup)
    .typed-text { color: #2563eb; }
    .cursor { display: inline-block; width: 2px; background-color: #333; margin-left: 2px; animation: blink 0.7s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    */
</style>

<div class="research-ticker">
  <div class="ticker-label">Research Interests</div>
  <div class="ticker-track">
    <div class="ticker-content" id="ticker-content"></div>
  </div>
</div>

<script>
    (function() {
        var interests = ['Mobile Systems', 'V2X Communications', '5G/6G Networks', 'Network Security', 'Mobile Health'];
        var sep = ' <span class="ticker-separator">|</span> ';
        var matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=<>~';

        function buildSet() {
            return interests.map(function(item) {
                return '<span class="ticker-item">' + item + '</span>';
            }).join(sep) + sep;
        }
        var oneSet = buildSet();

        var el = document.getElementById('ticker-content');
        el.innerHTML = '<span id="ticker-half-1" style="padding:0">' + oneSet + '</span><span style="padding:0">' + oneSet + '</span><span style="padding:0">' + oneSet + '</span>';

        // Scrolling
        var speed = 0.5;
        var setWidth = 0;
        var offset = 0;
        var initialized = false;

        function animate() {
            if (!initialized) {
                setWidth = document.getElementById('ticker-half-1').offsetWidth;
                if (setWidth > 0) initialized = true;
            }
            if (initialized) {
                offset += speed;
                if (offset >= setWidth) offset -= setWidth;
                el.style.transform = 'translateX(' + (offset - setWidth) + 'px)';
            }
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // Lock each item and separator to its rendered size to prevent glitch jitter
        var allItems = el.querySelectorAll('.ticker-item, .ticker-separator');
        allItems.forEach(function(span) {
            span.style.width = span.offsetWidth + 'px';
            span.style.height = span.offsetHeight + 'px';
            span.style.lineHeight = span.offsetHeight + 'px';
        });

        // Matrix glitch effect
        function glitchItem(span, original) {
            var steps = 18 + Math.floor(Math.random() * 18);
            var step = 0;
            span.classList.add('glitching');
            var iv = setInterval(function() {
                if (step < steps) {
                    var scrambled = '';
                    for (var i = 0; i < original.length; i++) {
                        if (original[i] === ' ') {
                            scrambled += ' ';
                        } else if (Math.random() < 0.4) {
                            scrambled += matrixChars[Math.floor(Math.random() * matrixChars.length)];
                        } else {
                            scrambled += original[i];
                        }
                    }
                    span.textContent = scrambled;
                    step++;
                } else {
                    span.textContent = original;
                    span.classList.remove('glitching');
                    clearInterval(iv);
                }
            }, 20);
        }

        // Each item and separator independently schedules its own glitch
        el.querySelectorAll('.ticker-item, .ticker-separator').forEach(function(span) {
            var original = span.textContent;
            function scheduleOne() {
                setTimeout(function() {
                    if (!span.classList.contains('glitching')) {
                        glitchItem(span, original);
                    }
                    scheduleOne();
                }, 3000 + Math.random() * 3000);
            }
            scheduleOne();
        });
    })();
</script>
