<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN"
  "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
<meta name="generator" content="Yiwen Hu" />
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
<link rel="stylesheet" href="assets/mysite.css" type="text/css" />
<link rel="icon" type="image/png" href="assets/favicon.png?v=2" />
<title>Yiwen Hu - Publications</title>
<style>
    /* Publication entry styles */
    .publication-entry {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: box-shadow 0.3s ease;
      margin-bottom: 20px;
      margin-right: 8px;
    }
    .publication-entry:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .publication-image {
      flex-shrink: 0;
      width: 300px;
      min-height: 200px;
      padding: 4px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .publication-image #pub-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 192px;
      color: #666;
      font-size: 14px;
      background-color: #e0e0e0;
      border-radius: 2px;
    }
    .publication-image img {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: block;
    }
    .publication-details {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 768px) {
      .publication-entry {
        flex-direction: column;
      }
      .publication-image {
        width: 100%;
        max-width: 100%;
        margin-bottom: 16px;
      }
    }
</style>
</head>
<body>
<div id="fwtitle">
</div>
<table summary="Table for page layout." id="tlayout">
<tr valign="top">
<td id="layout-menu">
<div id="sidebar-placeholder"></div>
<script>
fetch('sidebar.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('sidebar-placeholder').innerHTML = data;
    // Set current page
    var links = document.querySelectorAll('#layout-menu a[href="publications.html"]');
    if (links.length > 0) links[0].classList.add('current');
  });
</script>
</td>
<td id="layout-content">
<div id="toptitle">
<h1>Publications</h1>
</div>

<div id="publications-by-year-container">
  Loading publications...
</div>

<script>
(function() {
  fetch('publications/publications.json')
    .then(response => response.json())
    .then(data => {
      const styles = data.styles;
      const publications = data.publications;

      // Group publications by year
      const pubsByYear = {};
      publications.forEach(function(pub) {
        if (!pubsByYear[pub.year]) {
          pubsByYear[pub.year] = [];
        }
        pubsByYear[pub.year].push(pub);
      });

      // Get years sorted in descending order
      const years = Object.keys(pubsByYear).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
      });

      let html = '';

      years.forEach(function(year, yearIndex) {
        // Add year heading
        html += '<p><strong>' + year + '</strong></p>';

        // Add all publications for this year
        pubsByYear[year].forEach(function(pub, index) {
          var hasImage = pub.image && pub.image.trim() !== '';

          html += '<div class="publication-entry">';

          // Image section (only if image path exists)
          if (hasImage) {
            var uniqueId = 'pub-' + year + '-' + index;
            html += '<div class="publication-image" id="' + uniqueId + '-container">';
            html += '<span class="pub-placeholder">Loading...</span>';
            html += '<img class="pub-image" src="" alt="' + pub.title + '" style="display: none;" data-src="' + pub.image + '" data-id="' + uniqueId + '" />';
            html += '</div>';
          }

          // Details section
          html += '<div class="publication-details">';
          html += '<p><i>';

          // Conference badge
          html += '<span style="display: inline-block; ';
          html += 'background-color: ' + styles.conference.backgroundColor + '; ';
          html += 'color: ' + styles.conference.textColor + '; ';
          html += 'font-size: ' + styles.conference.fontSize + '; ';
          html += 'padding: ' + styles.conference.padding + '; ';
          html += 'border-radius: ' + styles.conference.borderRadius + '; ';
          html += 'font-weight: bold;">';
          html += pub.conference;
          html += '</span> ';

          // Title
          html += '<b style="color: ' + styles.title.color + '; ';
          html += 'font-weight: ' + styles.title.fontWeight + ';">';
          html += pub.title;
          html += '</b></i><br />';

          // Authors
          html += pub.authors;
          html += '<br />';

          // Details
          html += pub.details;
          html += '<br />';

          // Notes (if present)
          if (pub.notes && pub.notes.trim() !== '') {
            html += '<b style="color: ' + styles.notes.color + '; ';
            html += 'font-weight: ' + styles.notes.fontWeight + ';">';
            html += pub.notes;
            html += '</b><br />';
          }

          // Buttons
          if (pub.buttons && pub.buttons.length > 0) {
            pub.buttons.forEach(function(btn) {
              const buttonStyle = styles.buttons[btn.name] || {};
              html += '<a href="' + btn.link + '">';
              html += '<button style="display: inline-block; ';
              html += 'margin-bottom: 0.25em; ';
              html += 'margin-right: 0.5em; ';
              html += 'padding: ' + styles.buttonDefaults.padding + '; ';
              html += 'font-size: ' + styles.buttonDefaults.fontSize + '; ';
              html += 'border-radius: ' + styles.buttonDefaults.borderRadius + '; ';
              html += 'font-weight: ' + styles.buttonDefaults.fontWeight + '; ';
              html += 'background-color: ' + (buttonStyle.backgroundColor || '#7a8288') + '; ';
              html += 'color: ' + (buttonStyle.textColor || 'white') + ' !important; ';
              html += 'border: 0; ';
              html += 'cursor: pointer; ';
              html += 'text-align: center; ';
              html += 'font-family: Georgia;">';
              html += btn.name;
              html += '</button></a>';
            });
          }

          html += '</p>';
          html += '</div>'; // Close publication-details
          html += '</div>'; // Close publication-entry
        });

        // Add horizontal rule after each year except the last
        if (yearIndex < years.length - 1) {
          html += '<hr />';
        }
      });

      document.getElementById('publications-by-year-container').innerHTML = html;

      // Load images after DOM is updated
      publications.forEach(function(pub, globalIndex) {
        if (pub.image && pub.image.trim() !== '') {
          // Find the corresponding image element by data-id
          var imgElements = document.querySelectorAll('.pub-image[data-src="' + pub.image + '"]');

          imgElements.forEach(function(imgElement) {
            var uniqueId = imgElement.getAttribute('data-id');
            var imageContainer = document.getElementById(uniqueId + '-container');

            if (imgElement && imageContainer) {
              var placeholderElement = imageContainer.querySelector('.pub-placeholder');

              imgElement.onload = function() {
                imgElement.style.display = 'block';
                if (placeholderElement) placeholderElement.style.display = 'none';
              };

              imgElement.onerror = function() {
                if (imageContainer && imageContainer.parentNode) {
                  imageContainer.parentNode.removeChild(imageContainer);
                }
              };

              imgElement.src = imgElement.getAttribute('data-src');
            }
          });
        }
      });
    })
    .catch(error => {
      document.getElementById('publications-by-year-container').innerHTML =
        '<p style="color: red;">Error loading publications: ' + error.message + '</p>';
    });
})();
</script>

<div id="footer">
<div id="footer-text">
Page modified 2025-11-20, by Yiwen Hu</a>.
</div>
</div>
</td>
</tr>
</table>
</body>
</html>
