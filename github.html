<style>
.gh-profile {
  text-align: center;
  margin: 20px 0 30px 0;
  padding: 24px;
  background: #fafafa;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
}
.gh-profile img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 3px solid #ddd;
  margin-bottom: 12px;
}
.gh-profile .gh-name {
  font-size: 20px;
  font-weight: bold;
  margin: 0 0 4px 0;
}
.gh-profile .gh-bio {
  color: #666;
  margin: 0 0 16px 0;
}
.gh-profile a.gh-btn {
  display: inline-block;
  background: #24292e;
  color: white !important;
  padding: 10px 24px;
  border-radius: 4px;
  font-weight: bold;
  font-size: 16px;
  text-decoration: none;
  border: none !important;
}
.gh-profile a.gh-btn:hover {
  background: #444d56;
  border: none !important;
}
.gh-repo-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}
.gh-repo-card {
  width: calc(50% - 8px);
  background: #fafafa;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 16px;
  box-sizing: border-box;
  transition: box-shadow 0.2s ease;
}
.gh-repo-card:hover {
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}
.gh-repo-card .repo-name {
  font-weight: bold;
  font-size: 1.05em;
  margin: 0 0 6px 0;
}
.gh-repo-card .repo-desc {
  font-size: 0.9em;
  color: #555;
  margin: 0 0 8px 0;
  line-height: 1.4;
}
.gh-repo-card .repo-meta {
  font-size: 0.8em;
  color: #888;
}
.gh-repo-card .repo-meta span {
  margin-right: 12px;
  padding: 0;
}
@media (max-width: 768px) {
  .gh-repo-card { width: 100%; }
}
</style>

    document.getElementById('sidebar-placeholder').innerHTML = data;
    var links = document.querySelectorAll('#layout-menu a[href="github.html"]');
    if (links.length > 0) links[0].classList.add('current');
  });

<td id="layout-content">
<div id="toptitle">
<h1>Estel Lab on GitHub</h1>
</div>

<!-- Profile section -->
<div class="gh-profile" id="gh-profile">
  Loading...
</div>

<h2>Repositories</h2>
<div id="gh-repos" class="gh-repo-grid">
  Loading repositories...
</div>

<script>
(function() {
  // GitHub account handle. Renamed from 'ewinslab' during the rebrand. GitHub
  // redirects the old web URL but the REST API returns 404 for it, so this has
  // to track the current handle or the repo list silently empties.
  var username = 'Estel-at-UMBC';
  // What the page shows. Kept independent of the account so the site's wording
  // stays under our control no matter what the profile reports.
  var labName = 'Estel Lab';
  var labBio = 'Exploring Secure Sky-Terrestrial Networks for Intelligence @ UMBC';

  function profileHtml(user) {
    var html = '';
    if (user && user.avatar_url) {
      html += '<img src="' + user.avatar_url + '" alt="' + labName + '" />';
    }
    html += '<p class="gh-name">' + labName + '</p>';
    html += '<p class="gh-bio">' + labBio + '</p>';
    html += '<a class="gh-btn" href="https://github.com/' + username + '" target="_blank">Visit on GitHub</a>';
    return html;
  }

  // Fetch profile
  fetch('https://api.github.com/users/' + username)
    .then(function(r) { return r.json(); })
    .then(function(user) {
      document.getElementById('gh-profile').innerHTML = profileHtml(user);
    })
    .catch(function() {
      document.getElementById('gh-profile').innerHTML = profileHtml(null);
    });

  // Extra repos to include alongside the synced account repos.
  // Optional `description` overrides the GitHub API description.
  var extraRepos = [
    {
      slug: 'EmergencyAccess/Emergency-Blocker-Dialer-Tools',
      description: 'An Android toolkit that blocks SIP/3G emergency-call signaling (Emerg-Call-Blocker) and reroutes 911 calls through the strongest available network including Wi-Fi (Emerg-Call-Dialer).'
    }
  ];

  // Fetch user repos and extra repos in parallel
  var userReposPromise = fetch('https://api.github.com/users/' + username + '/repos?sort=updated&per_page=20')
    .then(function(r) { return r.json(); })
    .catch(function() { return []; });

  var extraReposPromises = extraRepos.map(function(entry) {
    return fetch('https://api.github.com/repos/' + entry.slug)
      .then(function(r) { return r.json(); })
      .then(function(repo) {
        if (repo && !repo.message && entry.description) {
          repo.description = entry.description;
        }
        return repo;
      })
      .catch(function() { return null; });
  });

  Promise.all([userReposPromise].concat(extraReposPromises))
    .then(function(results) {
      var userRepos = Array.isArray(results[0]) ? results[0] : [];
      var extras = results.slice(1).filter(function(x) { return x && !x.message && x.html_url; });
      var allRepos = extras.concat(userRepos);
      // Dedupe by full_name in case an extra repo is already in the user list
      var seen = {};
      allRepos = allRepos.filter(function(r) {
        if (seen[r.full_name]) return false;
        seen[r.full_name] = true;
        return true;
      });
      // Sort by updated_at descending
      allRepos.sort(function(a, b) { return new Date(b.updated_at) - new Date(a.updated_at); });

      var container = document.getElementById('gh-repos');
      var html = '';
      allRepos.forEach(function(repo) {
        if (repo.fork) return;
        var updated = new Date(repo.updated_at).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
        html += '<div class="gh-repo-card">';
        // Our own repos show the bare name: the owner prefix is redundant on this
        // page and still carries the old lab handle. Repos owned by someone else
        // keep the full owner/name so the source stays clear.
        var owner = repo.owner && repo.owner.login;
        var label = (owner && owner.toLowerCase() === username.toLowerCase()) ? repo.name : repo.full_name;
        html += '<p class="repo-name"><a href="' + repo.html_url + '" target="_blank">' + label + '</a></p>';
        html += '<p class="repo-desc">' + (repo.description || 'No description') + '</p>';
        html += '<p class="repo-meta">';
        if (repo.language) html += '<span>' + repo.language + '</span>';
        html += '<span>Updated ' + updated + '</span>';
        html += '</p>';
        html += '</div>';
      });
      if (!html) html = '<p>No public repositories yet. Stay tuned!</p>';
      container.innerHTML = html;
    })
    .catch(function() {
      document.getElementById('gh-repos').innerHTML = '<p>Could not load repositories. <a href="https://github.com/' + username + '" target="_blank">View on GitHub</a></p>';
    });
})();
</script>
